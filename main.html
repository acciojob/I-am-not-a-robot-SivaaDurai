
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="player">
        <video class="player__video" src="download.mp4"></video>

        <div class="player__controls">
            <button class="player__button toggle" title="Play/Pause">►</button>

            <input type="range" class="progress" min="0" max="100" value="0" step="0.1">
            
            <input type="range" class="player__slider" name="volume"
                min="0" max="1" step="0.05" value="1">

            <input type="range" class="player__slider" name="playbackRate"
                min="0.5" max="2" step="0.1" value="1">

            <button data-skip="-10">« 10s</button>
            <button data-skip="25">25s »</button>
        </div>

        <p id="error"></p>
    </div>

    <script src="./script.js"></script>
</body>
</html>
